<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juegos Cuarto Basico</title>
    <link rel="stylesheet" href="css/4basico.css">
</head>

<body>

    <main class="contenedor">
        <div class="header-rect">Juegos Cuarto Basico</div>

        <p class="intro">Bienvenido a la pagina de juegos de 4° basico. Aqui­ encontraras actividades educativas para aprender jugando.</p>

        <div class="grid">
            <div class="column">
                <button id="btnNumeros" class="game-btn">super mercado</button>
                <button id="btnAct2" class="game-btn">Semaforo Numerico</button>
                <button id="btnAct3" class="game-btn">meteoritos numericos</button>
            </div>
            <div class="column">
                <button id="btnAct4" class="game-btn">Bingo de miles</button>
                <button id="btnAct5" class="game-btn">Detective de numeros</button>
                <button id="btnAct6" class="game-btn">Orden Relampago</button>
            </div>
        </div>

        <div class="footer-actions">
            <button id="btnTodos">Ver todos los juegos</button>
            <button id="btnVolver">Volver a Bienvenida</button>
        </div>
    </main>

    <script src="js/4basico.js"></script>
</body>

</html>
