<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juegos Cuarto Básico</title>
    <link rel="stylesheet" href="css/4basico.css">
</head>

<body>

    <main class="contenedor">
        <div class="header-rect">Juegos Cuarto Básico</div>

        <p class="intro">Bienvenido a la página de juegos de 4º básico. Aquí encontrarás actividades educativas para aprender jugando.</p>

        <div class="grid">
            <div class="column">
                <button id="btnNumeros" class="game-btn">super mercado</button>
                <button id="btnAct2" class="game-btn">Semáforo Numérico</button>
                <button id="btnAct3" class="game-btn">Actividad 3</button>
            </div>
            <div class="column">
                <button id="btnAct4" class="game-btn">Actividad 4</button>
                <button id="btnAct5" class="game-btn">Actividad 5</button>
                <button id="btnAct6" class="game-btn">Actividad 6</button>
            </div>
        </div>

        <div class="footer-actions">
            <button id="btnVolver">Volver a Bienvenida</button>
        </div>
    </main>

    <script src="js/4basico.js"></script>
</body>

</html>
