<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conteo 0 al 10.000</title>
    <link rel="stylesheet" href="css/conteo0a10000.css">
</head>

<body>

    <main class="contenedor">
        <div class="header-rect">Aprender a leer, escribir y representar números del 0 al 10.000</div>

        <div class="precios-rect">
            <h2>Precios de Artículos</h2>
            <div class="items-grid">
                <div class="item">
                    <span class="item-name">📚 Libro</span>
                    <span class="item-price">$3.045</span>
                    <span class="item-text" id="text-3045"></span>
                </div>
                <div class="item">
                    <span class="item-name">🍎 Manzana</span>
                    <span class="item-price">$2.990</span>
                    <span class="item-text" id="text-2990"></span>
                </div>
                <div class="item">
                    <span class="item-name">👕 Polera</span>
                    <span class="item-price">$7.030</span>
                    <span class="item-text" id="text-7030"></span>
                </div>
                <div class="item">
                    <span class="item-name">👖 Pantalones</span>
                    <span class="item-price">$9.060</span>
                    <span class="item-text" id="text-9060"></span>
                </div>
                <div class="item">
                    <span class="item-name">🧢 Gorro</span>
                    <span class="item-price">$5.087</span>
                    <span class="item-text" id="text-5087"></span>
                </div>
                <div class="item">
                    <span class="item-name">🎸 Guitarra</span>
                    <span class="item-price">$10.000</span>
                    <span class="item-text" id="text-10000"></span>
                </div>
            </div>
        </div>

        <button id="btnVolver">Volver</button>
    </main>

    <script src="js/conteo0a10000.js"></script>
</body>

</html>
