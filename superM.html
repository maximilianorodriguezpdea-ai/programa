<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supermercado</title>
    <link rel="stylesheet" type="text/css" href="css/superM.css">
</head>

<body>

    <main class="contenedor">
        <div class="header-rect">Ordena los productos de menor a mayor precio</div>

        <div class="contenido">
            <p>Haz clic en los productos en orden de menor a mayor precio. Aprenderás a comparar números grandes.</p>
        </div>

        <div class="market-rect">
            <h2>Productos disponibles</h2>
            <div class="products-container" id="productsContainer"></div>

            <h2>Tu orden</h2>
            <div class="selected-order" id="selectedOrder">
                <p class="empty-text">Haz clic en los productos en orden de menor a mayor</p>
            </div>

            <div class="actions">
                <button id="submitBtn" class="submit-btn" style="display: none;">Verificar orden</button>
                <button id="resetBtn" class="reset-btn">Reiniciar</button>
            </div>

            <div class="result" id="result"></div>

            <div class="final-results" id="finalResults" style="display: none;">
                <h2>Resultados finales</h2>
                <table class="final-table">
                    <thead>
                        <tr>
                            <th>Ejercicio</th>
                            <th>Errores</th>
                            <th>Puntos</th>
                        </tr>
                    </thead>
                    <tbody id="finalResultsBody"></tbody>
                    <tfoot>
                        <tr>
                            <td colspan="2"><strong>Total</strong></td>
                            <td id="finalTotalPoints"><strong>0</strong></td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>

        <button id="btnVolver">Volver</button>
    </main>

    <div id="confettiContainer" class="confetti-container"></div>

    <script src="js/superM.js"></script>
</body>

</html>
